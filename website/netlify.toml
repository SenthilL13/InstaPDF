# Netlify Configuration inside website/ directory

[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/extract"
  to = "/.netlify/functions/extract"
  status = 200

[[redirects]]
  from = "/api/proxy-image"
  to = "/.netlify/functions/proxy-image"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
